<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img" aria-labelledby="t d"><title id="t">PawHelp matching logic</title><desc id="d">Three record types in one data.csv file pass compatibility filters to produce candidate combinations and overdue reminders.</desc><rect width="1100" height="400" rx="24" fill="#112C43"/><text x="45" y="52" fill="#F7FAFC" font-family="Arial" font-size="24" font-weight="700">How PawHelp creates a candidate match</text><text x="45" y="78" fill="#B8CCD8" font-family="Arial" font-size="13">One raw CSV · three record types · transparent matching rules</text>
<g font-family="Arial"><g fill="#F7FAFC"><rect x="45" y="115" width="245" height="65" rx="11"/><rect x="45" y="195" width="245" height="65" rx="11"/><rect x="45" y="275" width="245" height="65" rx="11"/></g><g fill="#17344A" font-size="15" font-weight="700"><text x="65" y="143">data.csv · feeding_point</text><text x="65" y="223">data.csv · food_offer</text><text x="65" y="303">data.csv · volunteer</text></g><g fill="#526779" font-size="11"><text x="65" y="162">Need · area · food · quantity</text><text x="65" y="242">Food · amount · expiry</text><text x="65" y="322">Area · available time window</text></g><path d="M300 147h30v115h30M300 227h60M300 307h30V262" fill="none" stroke="#F4B45F" stroke-width="2.5"/><rect x="370" y="130" width="365" height="235" rx="16" fill="#EAF2F6"/><text x="396" y="165" fill="#17344A" font-size="17" font-weight="700">Compatibility checks</text><g fill="#168C7B"><circle cx="399" cy="198" r="5"/><circle cx="399" cy="233" r="5"/><circle cx="399" cy="268" r="5"/><circle cx="399" cy="303" r="5"/></g><g fill="#314E60" font-size="13"><text x="416" y="203">Same manually entered area label</text><text x="416" y="238">Same food category and quantity unit</text><text x="416" y="273">Enough unexpired food is available</text><text x="416" y="308">Volunteer is available at this time</text></g><path d="M745 247h42l-9-8m9 8-9 8" fill="none" stroke="#F4B45F" stroke-width="3"/><rect x="800" y="130" width="255" height="235" rx="16" fill="#F7FAFC"/><text x="826" y="165" fill="#17344A" font-size="17" font-weight="700">Useful output</text><rect x="826" y="190" width="203" height="52" rx="9" fill="#DDF5EF"/><text x="842" y="221" fill="#176B61" font-size="14" font-weight="700">Candidate combinations</text><rect x="826" y="258" width="203" height="52" rx="9" fill="#FFF0D9"/><text x="842" y="289" fill="#94601D" font-size="14" font-weight="700">Overdue reminders</text><text x="826" y="335" fill="#526779" font-size="11">Suggestions only — people verify</text></g><text x="45" y="382" fill="#B8CCD8" font-family="Arial" font-size="11">No GPS distance calculation: area-label equality is an MVP approximation. Partial offers are not combined.</text></svg>
