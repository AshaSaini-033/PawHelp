<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d"><title id="t">PawHelp workflow</title><desc id="d">Report a confirmed need, offer suitable food, check compatibility, let a volunteer claim, and confirm the visit.</desc><rect width="1200" height="360" rx="24" fill="#102A43"/><text x="48" y="54" fill="#F7FAFC" font-family="Arial" font-size="25" font-weight="700">From a local need to a confirmed visit</text><text x="48" y="82" fill="#B8CCD8" font-family="Arial" font-size="14">People coordinate the work. PawHelp makes local information easier to act on.</text>
<g font-family="Arial"><g fill="#F7FAFC"><rect x="40" y="125" width="202" height="166" rx="15"/><rect x="278" y="125" width="202" height="166" rx="15"/><rect x="516" y="125" width="202" height="166" rx="15"/><rect x="754" y="125" width="202" height="166" rx="15"/><rect x="992" y="125" width="168" height="166" rx="15"/></g><g><rect x="40" y="125" width="202" height="7" rx="4" fill="#48B8A5"/><rect x="278" y="125" width="202" height="7" rx="4" fill="#F3B45B"/><rect x="516" y="125" width="202" height="7" rx="4" fill="#6FA9E8"/><rect x="754" y="125" width="202" height="7" rx="4" fill="#A88BE2"/><rect x="992" y="125" width="168" height="7" rx="4" fill="#48B8A5"/></g><g fill="#17344A" font-size="16" font-weight="700"><text x="61" y="177">1 · Report need</text><text x="299" y="177">2 · Offer food</text><text x="537" y="177">3 · Check match</text><text x="775" y="177">4 · Agree to help</text><text x="1013" y="177">5 · Confirm</text></g><g fill="#526779" font-size="13"><text x="61" y="211"><tspan x="61">Feeder confirms</tspan><tspan x="61" dy="19">the point and what</tspan><tspan x="61" dy="19">is actually needed.</tspan></text><text x="299" y="211"><tspan x="299">Donor records a real</tspan><tspan x="299" dy="19">quantity, food type,</tspan><tspan x="299" dy="19">area and expiry.</tspan></text><text x="537" y="211"><tspan x="537">Same area, food type</tspan><tspan x="537" dy="19">and unit; enough food</tspan><tspan x="537" dy="19">is still available.</tspan></text><text x="775" y="211"><tspan x="775">A currently available</tspan><tspan x="775" dy="19">person explicitly</tspan><tspan x="775" dy="19">agrees to help.</tspan></text><text x="1013" y="211"><tspan x="1013">Feeder confirms</tspan><tspan x="1013" dy="19">the visit or</tspan><tspan x="1013" dy="19">delivery.</tspan></text></g><g stroke="#F3B45B" stroke-width="3" fill="none"><path d="M247 208h24m-8-7 8 7-8 7"/><path d="M485 208h24m-8-7 8 7-8 7"/><path d="M723 208h24m-8-7 8 7-8 7"/><path d="M961 208h24m-8-7 8 7-8 7"/></g></g><text x="48" y="330" fill="#B8CCD8" font-family="Arial" font-size="12">A suggestion is not a reservation. An agreement is not proof of delivery. The feeder remains in control.</text></svg>
