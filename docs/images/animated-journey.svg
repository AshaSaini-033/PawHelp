<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">PawHelp animated coordination journey</title><desc id="desc">A visual flow from animal sighting to a confirmed community visit, with an animated marker moving along the path.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102c43"/><stop offset="1" stop-color="#244b50"/></linearGradient><linearGradient id="path" x1="0" x2="1"><stop stop-color="#e5b46b"/><stop offset="1" stop-color="#63b59c"/></linearGradient></defs><rect width="1200" height="520" rx="28" fill="url(#bg)"/><text x="55" y="66" fill="#fff" font-family="Arial" font-size="30" font-weight="700">A sighting becomes coordinated community care</text><text x="55" y="98" fill="#c6d9d5" font-family="Arial" font-size="16">A human-confirmed journey — not an automatic dispatch system</text><path d="M125 250 H1075" stroke="#476875" stroke-width="10" stroke-linecap="round"/><path d="M125 250 H1075" stroke="url(#path)" stroke-width="4" stroke-dasharray="13 15" stroke-linecap="round"/><circle r="12" fill="#fff4d8" stroke="#d99b50" stroke-width="5"><animateMotion dur="8s" repeatCount="indefinite" path="M125 250 H1075"/></circle><g font-family="Arial" text-anchor="middle"><g><circle cx="125" cy="250" r="43" fill="#e8f0e5"/><text x="125" y="263" font-size="35">👀</text><text x="125" y="330" fill="#fff" font-size="18" font-weight="700">Notice</text><text x="125" y="356" fill="#c6d9d5" font-size="13">Record a sighting</text></g><g><circle cx="315" cy="250" r="43" fill="#f5e8d8"/><text x="315" y="263" font-size="35">📍</text><text x="315" y="330" fill="#fff" font-size="18" font-weight="700">Confirm need</text><text x="315" y="356" fill="#c6d9d5" font-size="13">Feeder verifies</text></g><g><circle cx="505" cy="250" r="43" fill="#e7edf2"/><text x="505" y="263" font-size="35">🥣</text><text x="505" y="330" fill="#fff" font-size="18" font-weight="700">Food offer</text><text x="505" y="356" fill="#c6d9d5" font-size="13">Real quantity + expiry</text></g><g><circle cx="695" cy="250" r="43" fill="#eee8f5"/><text x="695" y="263" font-size="35">🙋</text><text x="695" y="330" fill="#fff" font-size="18" font-weight="700">Volunteer</text><text x="695" y="356" fill="#c6d9d5" font-size="13">Real time window</text></g><g><circle cx="885" cy="250" r="43" fill="#e8f0e5"/><text x="885" y="263" font-size="35">🔗</text><text x="885" y="330" fill="#fff" font-size="18" font-weight="700">Match</text><text x="885" y="356" fill="#c6d9d5" font-size="13">Rules check fit</text></g><g><circle cx="1075" cy="250" r="43" fill="#f5e8d8"/><text x="1075" y="263" font-size="35">🐾</text><text x="1075" y="330" fill="#fff" font-size="18" font-weight="700">Confirm</text><text x="1075" y="356" fill="#c6d9d5" font-size="13">People verify visit</text></g></g><rect x="55" y="420" width="1090" height="55" rx="12" fill="#173b49" stroke="#3e6b68"/><text x="80" y="454" fill="#d7e9df" font-family="Arial" font-size="15">Important: PawHelp suggests possible connections. People decide, coordinate and confirm what happened.</text></svg>